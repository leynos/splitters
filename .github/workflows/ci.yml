name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          expect-cache: any
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: >-
          leynos/shared-actions/.github/actions/install-mdtablefix@0606ca899ce2995a0c4bc78e660e80832e6e8855
        with:
          version: '0.6.1'
      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e
        with:
          globs: '**/*.md'
      - name: Install mold linker
        # The Makefile restates the build standard's `mold` flag for its
        # gate targets, so the linker must be present before they build.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends mold
      - name: Lint
        run: make lint
      - name: Setup uv
        uses: astral-sh/setup-uv@b06acff4b6a41bdd9cdac56507ead0bd7734e757
        with:
          # A Rust-only repository has no Python dependency manifest for the
          # cache key, so caching would only warn about unmatched inputs.
          enable-cache: false
      - name: Workflow contract tests
        run: make test-workflow-contracts
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@cabf105ae230e3759cf77b1c2d1d73ea0b67e9a9
        env:
          # The development profile selects Cranelift, which cannot build
          # `-Cinstrument-coverage`; the test profile inherits it. The
          # action's own `cargo install` runs outside the workspace
          # configuration, so it needs the unstable feature from the
          # environment to accept the profile key.
          CARGO_UNSTABLE_CODEGEN_BACKEND: "true"
          CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
        with:
          output-path: lcov.info
          format: lcov
          # The pull request measures coverage for its own ratchet check and
          # nothing else: it neither publishes the report nor contacts
          # CodeScene. Main owns both, in coverage-main.yml, and
          # `make test-workflow-contracts` holds the split.
          with-ratchet: 'true'
          publish-artefact: 'false'
